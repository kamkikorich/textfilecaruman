version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: textfileskbbk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: textfileskbbk
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - textfileskbbk-network

  # Next.js Application (Development)
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: textfileskbbk-web
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/textfileskbbk
      - NEXTAUTH_SECRET=your-secret-key-change-in-production-min-32-chars
      - NEXTAUTH_URL=http://localhost:3000
      - BILLPLZ_SECRET_KEY=your_billplz_secret_key
      - BILLPLZ_WEBHOOK_KEY=your_billplz_webhook_key
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - textfileskbbk-network
    command: npm run dev

volumes:
  postgres_data:
    driver: local

networks:
  textfileskbbk-network:
    driver: bridge
